services:
  openserp:
    image: karust/openserp:latest
    init: true
    # Chrome crashes with "Out of memory" on page loads when /dev/shm is the default 64MB.
    shm_size: 2gb
    ports:
      - "7000:7000"
    command: serve -l
    volumes:
      - ./config.yaml:/usr/src/app/config.yaml:ro
    environment:
      OPENSERP_SERVER_HOST: "0.0.0.0"
      OPENSERP_SERVER_PORT: "7000"
      OPENSERP_BAIDU_RATE_REQUESTS: "6"
      OPENSERP_BAIDU_RATE_BURST: "2"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:7000/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENSERP_BASE_URL: http://openserp:7000
      OPENSERP_TIMEOUT: "120"
      PORT: "8000"
      API_KEY: ${API_KEY:-}
    depends_on:
      openserp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
